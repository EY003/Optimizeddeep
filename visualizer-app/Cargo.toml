[package]
name = "visualizer-app"
version = "0.1.0"
edition = "2021"

[dependencies]
visualizer-core = { path = "../visualizer-core" }
eframe = "0.27"
egui = "0.27"
tokio = { version = "1", features = ["full"] }
tray-icon = "0.11"
global-hotkey = "0.4"
serde = { version = "1", features = ["derive"] }
toml = "0.8"
image = "0.24"
rfd = "0.14" # Added for the font selection dialog

[build-dependencies]
winres = "0.1" # Added for Windows .exe metadata and icon
