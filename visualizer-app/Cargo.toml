[package]
name = "visualizer-app"
version = "0.1.0"
edition = "2021"

[dependencies]
visualizer-core = { path = "../visualizer-core" }
eframe = { version = "0.27", features = ["wgpu"] }
egui = "0.27"
tokio = { version = "1", features = ["full"] }
tray-icon = "0.11"
global-hotkey = "0.4"
serde = { version = "1", features = ["derive"] }
toml = "0.8"
image = "0.24"
rfd = "0.14"
crossbeam-channel = "0.5"
glow = "0.13" # <--- Add this line to fix the `glow::Context` error later!
arc-swap = "1.7"

[build-dependencies]
winres = "0.1"
