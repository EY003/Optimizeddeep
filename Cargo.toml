[workspace]
members = [
    "visualizer-core"
]
resolver = "2"

[package]
name = "music_visualizer"
version = "0.1.0"
edition = "2021"

[dependencies]
visualizer-core = { path = "visualizer-core" }
eframe = "0.29.1"
egui = "0.29.1"
tokio = { version = "1.0", features = ["full"] }
windows = { version = "0.58", features = [
    "Media_Control",
    "Storage_Streams",
    "Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Foundation",
    "Win32_System_Com",
] }
